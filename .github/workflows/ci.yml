name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})${{ matrix.os == 'macos-latest' && '' || ' — informational' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS is what this fork is used on, so macOS is what a red run means.
    #
    # The other two still run, because knowing is worth more than not knowing,
    # but they do not gate: what fails there is a handful of checks that drive
    # Chromium's input and colour paths through a hidden window, and those
    # differ by platform in ways that belong to the test technique rather than
    # to the app — a drag sent as mouse events reaches a pointer listener on
    # macOS and nowhere else. Left blocking, they would turn the whole signal
    # into noise nobody can act on; left out entirely, a real cross-platform
    # break would go unseen. So they report, and stay out of the gate.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # thumbs.js opens a real Electron window, so the Linux runner needs a
      # display, and Ubuntu 24.04's AppArmor blocks Electron's unprivileged
      # user-namespace sandbox unless the restriction is lifted.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -q kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
